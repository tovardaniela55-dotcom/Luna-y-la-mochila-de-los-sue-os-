<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luna y la mochila de los sueños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#FBEAF5;--bg2:#E6EFFF;--card:#FFFFFF;--ink:#1F2340;--soft:#4B5072;--pink:#F472B6;--mag:#DB2777;--pur:#7E22CE;--pinkbg:#FCE7F3;--purbg:#FAF5FF;--purline:#E9D5FF;--pinkline:#FBCFE8;--grad:linear-gradient(90deg,#EC4899,#8B5CF6);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2A1740;--bg2:#171A3A;--card:#2B2750;--ink:#FFF3FA;--soft:#D6D0F0;--mag:#FF8CC6;--pur:#D8B4FE;--pinkbg:#4A1F48;--purbg:#33295E;--purline:#5B4A99;--pinkline:#6B3566}}
:root[data-theme="dark"]{--bg1:#2A1740;--bg2:#171A3A;--card:#2B2750;--ink:#FFF3FA;--soft:#D6D0F0;--mag:#FF8CC6;--pur:#D8B4FE;--pinkbg:#4A1F48;--purbg:#33295E;--purline:#5B4A99;--pinkline:#6B3566}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:1.08rem;line-height:1.65}
main{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:26px 26px 0 0;padding:12px 14px}
header .bag{font-size:2.3rem;line-height:1}
header h1{flex:1;margin:0;font:700 1.15rem/1.2 "Fredoka",sans-serif;color:var(--mag)}
.pill{background:var(--purbg);color:var(--pur);font:700 .95rem/1.2 "Fredoka",sans-serif;border-radius:999px;padding:8px 14px;text-align:center}
.sound{border:0;background:var(--pinkbg);color:var(--mag);border-radius:999px;width:46px;height:46px;font-size:1.3rem;cursor:pointer;padding:0}
.card{background:var(--card);border:4px solid var(--pink);border-radius:30px;padding:16px;margin-top:10px}
.pic{position:relative;border-radius:22px;overflow:hidden;background:var(--pinkbg)}
.pic img{display:block;width:100%;height:auto}
.pic img.sq{aspect-ratio:1/1;object-fit:cover;object-position:72% 50%}
.pic .tag{position:absolute;right:12px;bottom:12px;background:#EC4899;color:#fff;font:700 .9rem/1 "Fredoka",sans-serif;border-radius:999px;padding:9px 14px}
.topic{display:inline-block;background:var(--pinkbg);color:var(--mag);font:700 .98rem/1.35 "Fredoka",sans-serif;border-radius:18px;padding:8px 14px;margin:14px 0 4px}
h2{font:700 1.8rem/1.2 "Fredoka",sans-serif;margin:.3rem 0 .4rem}
p{margin:.4rem 0;color:var(--soft)}
.think{background:var(--purbg);border:2px solid var(--purline);border-radius:22px;padding:14px 16px;margin:14px 0;color:var(--pur)}
.think b{display:block;font:700 1.15rem/1.3 "Fredoka",sans-serif;margin-bottom:4px}
.ans{background:var(--card);border:2px solid var(--pinkline);border-radius:20px;padding:12px 14px;margin:10px 0;color:var(--ink)}
.msg{background:var(--grad);color:#fff;border-radius:20px;padding:14px 16px;font:700 1.1rem/1.4 "Fredoka",sans-serif;text-align:center;margin:14px 0}
.nav{display:flex;gap:10px;border-top:1px solid var(--purline);padding-top:14px;margin-top:14px}
button{font:700 1.05rem/1.2 "Fredoka",sans-serif;border:0;border-radius:999px;cursor:pointer;min-height:50px;padding:12px 20px}
.back{background:var(--purbg);color:var(--ink)}
.next{flex:1;background:var(--grad);color:#fff}
button[disabled]{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.dream{display:flex;gap:8px;margin:6px 0 12px}
.dream input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:16px;border:2px solid var(--purline);background:var(--card);color:var(--ink)}
.save{background:#DB2777;color:#fff;padding:12px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row h3{font:700 1.1rem/1.3 "Fredoka",sans-serif;color:var(--pur);margin:8px 0}
.clr{background:var(--pinkbg);color:var(--mag);min-height:40px;padding:8px 14px}
.draw{border:3px dashed var(--purline);border-radius:22px;padding:8px}
canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#fff;border-radius:14px;touch-action:none}
.sw{display:flex;gap:10px;justify-content:center;margin:8px 0}
.sw button{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:3px solid var(--card)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
footer{text-align:center;color:var(--pur);font-weight:700;font-size:.95rem;padding:14px 8px}
.modal{position:fixed;inset:0;background:rgba(20,10,40,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
.modal.on{display:flex}
.box{background:var(--card);border:4px solid var(--pink);border-radius:28px;padding:22px;max-width:420px;text-align:center}
.box .trophy{font-size:3.4rem}
.box h3{font:700 1.6rem/1.2 "Fredoka",sans-serif;color:var(--mag);margin:6px 0}
.box .next{width:100%;margin-top:12px}
</style>
</head>
<body>
<main>
<header>
  <span class="bag" aria-hidden="true">🎒</span>
  <h1>Luna y la Mochila de los Sueños</h1>
  <button class="sound" id="snd" aria-label="Escuchar esta escena">🔊</button>
  <span class="pill" id="pg"></span>
</header>
<div class="card" id="stage" aria-live="polite"></div>
<footer>Material pedagógico para la equidad de género en la infancia · Universidad Colegio Mayor de Cundinamarca 🌟</footer>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="box"><div class="trophy" aria-hidden="true">🏆</div><h3 id="mt">¡Felicitaciones! 🎉</h3>
  <p id="mx"></p><button class="next" id="ok">¡Entendido, sigamos! 🚀</button></div>
</div>

var S = [
 {cover:1, tag:"Una aventura para descubrir que podemos ser lo que queramos.", h:"Luna y la Mochila de los Sueños",
  t:"Un día soleado, Luna salió al parque con una sonrisa enorme y unas ganas increíbles de correr, jugar y descubrir el mundo. Ella lleva una mochila muy especial: una mochila mágica llena de colores, estrellas y sorpresas que la acompaña a todas partes. ¡Acompáñala en esta gran aventura para demostrar que las niñas no tienen límites!",
  q:"¿Estás lista para abrir la mochila de los sueños con Luna?", qt:"Haz clic en “¡Comenzar Aventura!” para iniciar este viaje lleno de magia, igualdad y diversión."},
 {tag:"¿Los juegos tienen género?", h:"Aventura 1: El Balón",
  t:"Luna salió al parque con unas ganas enormes de correr detrás de un balón. Alguien le dijo: “¡Oye, Luna! El fútbol es cosa de niños, mejor vete a jugar con muñecas”. Luna sintió curiosidad y abrió su mochila mágica. De ahí salió un balón brillante y colorido. Ella sonrió y pensó: “¿Acaso los juegos tienen dueño?”",
  q:"Momento de Pensemos 💭", qt:"¿Alguna vez te han dicho que un juego o un juguete es solo para niños o solo para niñas? ¿Qué pasa si a una niña le encanta jugar fútbol?",
  a:["⚽ ¡Claro que sí! A mí me encanta correr y meter goles.","🧸 Puedo jugar fútbol, muñecas o lo que yo elija."], m:"✨ Mensaje Central: ¡Todas las niñas pueden jugar a lo que quieran!"},
 {tag:"Las niñas también construyen el futuro", h:"Aventura 2: El Casco de Constructora",
  t:"Más tarde, Luna entró al salón de juegos y quiso armar una torre gigante de bloques. Un compañero le dijo: “Cuidado, Luna, los edificios y la construcción son cosas de hombres”. Luna abrió su mochila mágica y sacó un casco amarillo brillante de constructora. Se lo puso con orgullo y comenzó a diseñar puentes y castillos altísimos.",
  q:"Momento de Pensemos 💭", qt:"¿Quiénes pueden construir torres, casas o inventar cosas grandes? Si una niña quiere construir o liderar, ¿puede hacerlo?",
  a:["🧱 ¡Sí! Podemos construir casas, robots e inventos increíbles.","🏗️ Todos podemos crear y diseñar si nos lo proponemos."], m:"✨ Mensaje Central: ¡Las niñas también construyen cosas grandes y pueden ser lo que imaginen!"},
 {tag:"Profesiones sin etiquetas", h:"Aventura 3: El Estetoscopio",
  t:"Al día siguiente, Luna jugó a ser doctora. Agarró su estetoscopio para escuchar los latidos del corazón de su osito enfermo y curar a sus amigos. Alguien murmuró: “Curar y cuidar es más de mujeres, pero mandar y dirigir es de hombres”. Luna abrió su mochila y entendió que las profesiones no se dividen por género, sino por lo que a cada quien le apasiona hacer en la vida.",
  q:"Momento de Pensemos 💭", qt:"¿Qué te gustaría ser de grande? ¿Hay trabajos exclusivos para hombres o para mujeres?",
  a:["👩‍⚕️🩺 ¡Quiero ser doctora, astronauta, ingeniera o lo que yo decida!","🚀 No hay trabajos de niños o de niñas, ¡todos podemos elegir nuestra vocación!"], m:"✨ Mensaje Central: ¡Puedo ser lo que sueño; las profesiones no tienen género!"},
 {tag:"Todas las emociones son válidas", h:"Aventura 4: El Corazón de Colores",
  t:"A veces, a Luna le dan ganas de llorar cuando se siente triste, o a veces se siente enojada. Antes se creía que las niñas no debían enojarse y que los niños nunca debían llorar. Pero Luna abrió su mochila y de allí brotó un corazón lleno de colores luminosos. Comprendió que todas las emociones son válidas y que sentir tristeza o miedo no nos hace más débiles.",
  q:"Momento de Pensemos 💭", qt:"¿Está bien llorar cuando estamos tristes o enojadas? ¿Qué hacemos cuando necesitamos ayuda?",
  a:["💖 Sí, llorar y sentir es normal, y siempre puedo pedir ayuda.","🫂 Cuidar nuestro corazón y el de los demás es muy importante."], m:"✨ Mensaje Central: ¡Todas las emociones valen y pedir ayuda está bien!"},
 {fin:1, tag:"Mi voz importa y mi futuro brilla", h:"Aventura 5 y Cierre: Mi Mochila de Sueños",
  t:"En la ronda del salón, la profesora preguntó quién quería dar una idea para organizar el nuevo espacio de juegos. Al principio, algunas niñas se quedaban calladas pensando que sus opiniones no importaban tanto. Pero Luna recordó el poder de su mochila, levantó la mano con firmeza y dijo: “¡Mi voz cuenta y tengo mucho que aportar!” Todos la escucharon con atención.",
  q:"¡Ahora es tu turno! ✨", qt:"Escribe tu gran sueño, guárdalo y dibuja tu mochila en el bloc de notas digital."}
];
var cur = 0, stage = document.getElementById("stage"), dream = "";
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function render(){
  var s = S[cur], h = "";
  h += '<div class="pic"><img src="'+IMG[cur]+'" class="'+(s.cover?"sq":"")+'" alt="Ilustración de la escena '+(cur+1)+': '+esc(s.h)+'"><span class="tag">Escena '+(cur+1)+' de '+S.length+'</span></div>';
  h += '<span class="topic">🌟 '+s.tag+'</span><h2>'+s.h+'</h2><p>'+s.t+'</p>';
  h += '<div class="think"><b>'+s.q+'</b>'+s.qt+'</div>';
  if(s.a) h += s.a.map(function(x){return '<div class="ans">'+x+'</div>';}).join('') + '<div class="msg">'+s.m+'</div>';
  if(s.fin){
    h += '<div class="dream"><input type="text" id="dr" maxlength="40" placeholder="Ej: Científica, artista, doctora..." aria-label="Cuando sea grande quiero..." value="'+esc(dream)+'"><button class="save" id="sv">Guardar 💾</button></div>';
    h += '<div class="row"><h3>Dibuja tu Mochila de Sueños 🎨</h3><button class="clr" id="cl">Borrar</button></div>';
    h += '<div class="draw"><canvas id="cv" width="600" height="400" tabindex="0" aria-label="Espacio para dibujar"></canvas></div><div class="sw" id="sw"></div>';
    h += '<div class="msg">✨ Compromiso Final: “Me trato con cariño y trato con respeto a las demás personas.”</div>';
  }
  h += '<div class="nav"><button class="back" id="bk"'+(cur===0?" disabled":"")+'>← Anterior</button>';
  h += '<button class="next" id="nx">'+(s.cover?"¡Comenzar Aventura! 🚀 →":s.fin?"🌟 ¡Reiniciar Aventura!":"Siguiente Aventura ➡️")+'</button></div>';
  stage.innerHTML = h;
  document.getElementById("pg").textContent = "Escena "+(cur+1)+" / "+S.length;
  document.getElementById("bk").onclick = function(){ go(cur-1); };
  document.getElementById("nx").onclick = function(){ s.fin ? (dream="", go(0)) : go(cur+1); };
  if(s.fin) draw();
  window.scrollTo(0,0);
}
function go(i){ if(window.speechSynthesis) speechSynthesis.cancel(); cur = Math.max(0, Math.min(S.length-1, i)); render(); }
function draw(){
  var cv = document.getElementById("cv"), x = cv.getContext("2d"), col = "#EC4899", on = false;
  var cs = ["#EC4899","#8B5CF6","#14B8A6","#F59E0B","#3B82F6","#1F2340"], sw = document.getElementById("sw");
  cs.forEach(function(c){ var b = document.createElement("button"); b.style.background = c; b.setAttribute("aria-label","Color "+c); b.setAttribute("aria-pressed", c===col);
    b.onclick = function(){ col = c; Array.prototype.forEach.call(sw.children, function(y){ y.setAttribute("aria-pressed", y===b); }); }; sw.appendChild(b); });
  function p(e){ var r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; }
  cv.onpointerdown = function(e){ on = true; cv.setPointerCapture(e.pointerId); var q = p(e); x.beginPath(); x.moveTo(q[0],q[1]); };
  cv.onpointermove = function(e){ if(!on) return; var q = p(e); x.lineTo(q[0],q[1]); x.strokeStyle = col; x.lineWidth = 8; x.lineCap = "round"; x.lineJoin = "round"; x.stroke(); };
  cv.onpointerup = cv.onpointercancel = function(){ on = false; };
  document.getElementById("cl").onclick = function(){ x.clearRect(0,0,cv.width,cv.height); };
  document.getElementById("sv").onclick = function(){
    dream = document.getElementById("dr").value.trim();
    document.getElementById("mx").textContent = (dream ? "Tu gran sueño: “"+dream+"”. " : "") + "Has completado la Mochila de los Sueños. ¡Recuerda que puedes ser lo que imaginas y tu voz siempre importa!";
    document.getElementById("modal").classList.add("on"); document.getElementById("ok").focus();
  };
}
document.getElementById("ok").onclick = function(){ document.getElementById("modal").classList.remove("on"); };
document.getElementById("snd").onclick = function(){
  if(!window.speechSynthesis) return;
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); return; }
  var s = S[cur], u = new SpeechSynthesisUtterance(s.h+". "+s.t+" "+(s.qt||"")); u.lang = "es-ES"; u.rate = .9; speechSynthesis.speak(u);
};
render();
</script>
